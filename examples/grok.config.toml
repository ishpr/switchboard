# Merge into ~/.grok/config.toml.
# Grok also loads .mcp.json, Claude MCP config, and Cursor mcp.json.
# One switchboard entry is enough. A second copy starts a second shim.

[mcp_servers.switchboard]
command = "node"
args = ["/absolute/path/to/switchboard/dist/cli.js", "mcp"]
env = { SWITCHBOARD_HARNESS = "grok", SWITCHBOARD_NAME = "grok" }
